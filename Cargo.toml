[package]
name = "github-action-console"
version = "0.1.0"
edition = "2024"

[lib]
name = "github_action_console"
path = "src/lib.rs"

[[bin]]
name = "github-action-console"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
chrono = "0.4"
gpui-kit = "0.6"
http = "1.5.0"
keyring = { version = "4.2", features = ["v1"] }
octocrab = { version = "0.54.2", features = ["tokio"] }
open = "5.4.4"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
